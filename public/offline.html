<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f1ea;
        color: #2f3a41;
        font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .card {
        background: #fdfbf7;
        border: 1px solid #ddd6c8;
        border-radius: 8px;
        padding: 28px 24px;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .dot {
        width: 48px; height: 48px; border-radius: 999px;
        background: #fdf0e4; color: #ef7a1f;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 16px; font-size: 24px; font-weight: 700;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: #6b7a85; margin: 0 0 20px; }
      button {
        width: 100%; padding: 14px; border: 0; border-radius: 8px;
        background: #1b8ed4; color: #fff; font-size: 15px; font-weight: 600;
        min-height: 48px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">!</div>
      <h1>You're offline</h1>
      <p>We can't reach your workshop right now. Check your connection and try again — your booking details are safe.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
